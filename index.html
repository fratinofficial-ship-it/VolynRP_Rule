<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Правила Volyn RP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: floating glass top bar (logo, version, language, theme), hero with an updates card, then a bento of rounded rule cards beside a sticky section index. Emergency-light glow is the one flourish. */
:root {
  --bg: #F2F5FA;
  --surface: #FFFFFF;
  --surface-2: #F1F4F9;
  --ink: #0E1A2B;
  --muted: #5A6779;
  --line: #E0E6EF;
  --accent: #E5303E;
  --on-accent: #FFFFFF;
  --blue: #2458D6;
  --amber: #B96F00;
  --green: #1C7757;
  --teal: #0E7F92;
  --slate: #3C4B60;
  --glass: rgba(255, 255, 255, .74);
  --glow-a: rgba(36, 88, 214, .20);
  --glow-b: rgba(229, 48, 62, .17);
  --shadow: 0 1px 2px rgba(14, 26, 43, .05), 0 18px 40px -18px rgba(14, 26, 43, .22);
  --font-body: "Manrope", "Segoe UI", Roboto, Arial, sans-serif;
  --font-display: "Unbounded", "Manrope", "Segoe UI", Arial, sans-serif;
  --r-lg: 28px;
  --r-md: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080D14; --surface: #101822; --surface-2: #162130; --ink: #E9EEF5; --muted: #93A1B2; --line: #1E2B3A;
    --accent: #FF5662; --on-accent: #1A0709; --blue: #7BA3FF; --amber: #F0B04A; --green: #5FD0A2; --teal: #4CC9DC; --slate: #A9B7C8;
    --glass: rgba(16, 24, 34, .72); --glow-a: rgba(80, 130, 255, .24); --glow-b: rgba(255, 86, 98, .18);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 18px 40px -18px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #080D14; --surface: #101822; --surface-2: #162130; --ink: #E9EEF5; --muted: #93A1B2; --line: #1E2B3A;
  --accent: #FF5662; --on-accent: #1A0709; --blue: #7BA3FF; --amber: #F0B04A; --green: #5FD0A2; --teal: #4CC9DC; --slate: #A9B7C8;
  --glass: rgba(16, 24, 34, .72); --glow-a: rgba(80, 130, 255, .24); --glow-b: rgba(255, 86, 98, .18);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 18px 40px -18px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: calc(140px + env(safe-area-inset-top, 0px)); }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  padding-block: 12px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
.wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; }

.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Smooth theme switch: colors fade while the theme class is on (set by the toggle for a moment) */
@property --glow-a { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --glow-b { syntax: "<color>"; inherits: true; initial-value: transparent; }
:root.theming { transition: --glow-a .55s ease, --glow-b .55s ease; }
.theming *, .theming *::before, .theming *::after {
  transition: background-color .55s ease, color .55s ease, border-color .55s ease, box-shadow .55s ease;
}

/* Top bar */
.bar {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 40;
  display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px;
  border-radius: 999px; background: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5);
}
.logo { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--on-accent); flex: none; }
.logo .ic { width: 22px; height: 22px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: .95rem; letter-spacing: -.01em; white-space: nowrap; }
.ver {
  font-weight: 800; font-size: .8rem; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, transparent);
}
.bar > * { flex: none; }
.spacer { flex: 1 1 auto; min-width: 0; }
.seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 2); border-radius: 999px; background: var(--surface); box-shadow: 0 1px 4px rgba(0, 0, 0, .2); }
.seg.ready .thumb { transition: transform .5s cubic-bezier(.34, 1.35, .64, 1); }
.seg[data-lang="uk"] .thumb { transform: translateX(100%); }
.seg button { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 7px; border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; font-weight: 700; font-size: .82rem; color: var(--muted); min-height: 32px; min-width: 62px; transition: color .3s ease; }
.seg button[aria-pressed="true"] { color: var(--ink); }
.flag { display: block; flex: none; width: 20px; height: 14px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .14); transition: transform .5s cubic-bezier(.34, 1.56, .64, 1); }
.flag-ru { background: linear-gradient(#fff 0 33.4%, #1C57A5 33.4% 66.7%, #D52B1E 66.7%); }
.flag-ua { background: linear-gradient(#0057B7 0 50%, #FFD500 50%); }
.seg button[aria-pressed="true"] .flag { transform: scale(1.12); }
.icon-btn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); }
.icon-btn { position: relative; overflow: hidden; transition: transform .25s ease, background-color .55s ease, border-color .55s ease, color .55s ease; }
.icon-btn:hover { background: var(--surface); }
.icon-btn:active { transform: scale(.9) rotate(-12deg); }
.icon-btn .ic { position: absolute; inset: 0; margin: auto; transition: transform .65s cubic-bezier(.34, 1.56, .64, 1), opacity .4s ease; }
.icon-btn .i-moon { opacity: 1; transform: rotate(0) scale(1); }
.icon-btn .i-sun { opacity: 0; transform: rotate(-120deg) scale(.3); }
:root[data-theme="dark"] .icon-btn .i-moon { opacity: 0; transform: rotate(120deg) scale(.3); }
:root[data-theme="dark"] .icon-btn .i-sun { opacity: 1; transform: rotate(0) scale(1); }

/* Hero */
.hero { position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; padding-block: 44px 8px; }
.hero::before {
  content: ""; position: absolute; inset: -24px 0 0 0; z-index: -1; pointer-events: none;
  background: radial-gradient(520px 300px at 8% 0%, var(--glow-a), transparent 70%), radial-gradient(460px 280px at 95% 8%, var(--glow-b), transparent 70%);
}
.lights { display: inline-flex; gap: 5px; margin-bottom: 14px; }
.lights i { width: 22px; height: 8px; border-radius: 99px; background: var(--blue); box-shadow: 0 0 12px var(--blue); animation: flash 1s infinite; }
.lights i:nth-child(even) { background: var(--accent); box-shadow: 0 0 12px var(--accent); animation-delay: .5s; }
@keyframes flash { 0%, 45% { opacity: 1; } 55%, 95% { opacity: .22; } }
.kicker { font-weight: 700; font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.9rem, 5vw, 3.1rem); line-height: 1.1; letter-spacing: -.025em; margin: 0 0 16px; text-wrap: balance; }
.lead { color: var(--muted); font-size: 1.05rem; max-width: 58ch; margin: 0 0 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; padding: 0; list-style: none; }
.chips li { display: inline-flex; align-items: center; gap: 6px; font-size: .84rem; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.chips .ic { width: 1.05em; height: 1.05em; color: var(--muted); }

.search { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.field { position: relative; flex: 1 0 100%; min-width: 0; }
.field .ic { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.field input { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 13px 18px 13px 46px; box-shadow: var(--shadow); }
.field input::placeholder { color: var(--muted); }
.search output { flex: 1 1 8rem; min-width: 0; min-height: 1.4em; color: var(--muted); font-size: .88rem; font-weight: 600; }

/* Updates card */
.updates { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--shadow); }
.updates-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.updates-head h2 { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.updates-head small { display: block; color: var(--muted); font-weight: 600; font-size: .8rem; }
.updates-head .ver { margin-left: auto; }
.badge { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 14px; color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 14%, transparent); }
.badge .ic { width: 22px; height: 22px; }
.upd { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.upd li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: var(--surface-2); font-weight: 600; font-size: .93rem; line-height: 1.35; }
.upd .badge { width: 34px; height: 34px; border-radius: 11px; }
.upd .badge .ic { width: 18px; height: 18px; }

/* Core rules */
.core { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 32px 0 0; padding: 0; list-style: none; }
.core li { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.core b { display: block; font-family: var(--font-display); font-size: 1rem; letter-spacing: -.01em; margin-bottom: 2px; }
.core li > div > span { color: var(--muted); font-size: .92rem; line-height: 1.45; display: block; }

/* Layout */
.layout { display: block; margin-top: 28px; }
.index { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); z-index: 20; margin-bottom: 20px; padding: 6px; border-radius: 999px; border: 1px solid var(--line); box-shadow: var(--shadow); background: var(--surface); }
.index ol { position: relative; list-style: none; margin: -8px -4px; padding: 8px 4px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.index ol::-webkit-scrollbar { display: none; }
.index a { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; white-space: nowrap; text-decoration: none; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: .9rem; color: var(--muted); transition: background-color .3s ease, color .4s ease; }
.index a:hover { background: var(--surface-2); color: var(--ink); }
.index a[aria-current="true"], .index a[aria-current="true"]:hover { background: transparent; color: var(--ink); }
.index a .ic { transition: color .4s ease; }
.index a[aria-current="true"] .ic { color: var(--tc, var(--accent)); animation: navpop .8s cubic-bezier(.34, 1.56, .64, 1) .1s both; }
@keyframes navpop { 0% { transform: scale(.3) rotate(-70deg); } 55% { transform: scale(1.45) rotate(16deg); } 100% { transform: scale(1) rotate(0); } }

/* Sliding pill behind the active link: stretches like gel toward the target, then settles with a shine and a ring. Colour follows the section's tone. */
.pill { position: absolute; z-index: 0; left: 0; top: 0; width: 0; height: 0; border-radius: 999px; pointer-events: none; opacity: 0;
  background-color: color-mix(in srgb, var(--pc, var(--accent)) 17%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pc, var(--accent)) 46%, transparent), 0 8px 22px -6px color-mix(in srgb, var(--pc, var(--accent)) 65%, transparent);
  transition: background-color .5s ease, box-shadow .5s ease, opacity .3s ease; }
.pill .sh { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; }
.pill i { position: absolute; top: 0; bottom: 0; left: 0; width: 45%; transform: translateX(-130%); background: linear-gradient(100deg, transparent, color-mix(in srgb, #fff 42%, transparent), transparent); }
.pill b { position: absolute; inset: 0; border-radius: inherit; border: 2px solid var(--pc, var(--accent)); opacity: 0; }
.index a[data-dim] { opacity: .35; }

main { display: grid; gap: 20px; min-width: 0; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
.col { display: grid; gap: 20px; min-width: 0; align-content: start; }
.sec { --c: var(--slate); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px; box-shadow: var(--shadow); min-width: 0; }
.tone-slate { --c: var(--slate); } .tone-teal { --c: var(--teal); } .tone-blue { --c: var(--blue); }
.tone-red { --c: var(--accent); } .tone-amber { --c: var(--amber); } .tone-green { --c: var(--green); }
.sec-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.sec-head h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; letter-spacing: -.02em; line-height: 1.2; margin: 0; text-wrap: balance; }
.eyebrow { font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--c); }
.note { color: var(--muted); font-size: .95rem; margin: 0 0 14px; max-width: 64ch; }

.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.rule { display: grid; grid-template-columns: 3.3rem minmax(0, 1fr); gap: 14px; align-items: start; padding: 12px 16px 12px 12px; border-radius: var(--r-md); background: var(--surface-2); }
.rule .n { justify-self: start; font-weight: 800; font-size: .85rem; line-height: 1; padding: 6px 10px; border-radius: 999px; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); font-variant-numeric: tabular-nums; margin-top: 2px; white-space: nowrap; }
.rule p { margin: 0; max-width: 70ch; }
.terms .rule { grid-template-columns: 6.4rem minmax(0, 1fr); }

.scroll { overflow-x: auto; border-radius: var(--r-md); border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: .94rem; }
th, td { text-align: left; padding: 12px 16px; vertical-align: top; }
th { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); font-weight: 800; }
td { border-top: 1px solid var(--line); }
td:first-child { font-weight: 700; }

.empty { display: none; text-align: center; color: var(--muted); padding: 40px 0; }
.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 36px; padding: 16px 20px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
.foot p { margin: 0; flex: 1 1 320px; }
.foot .copy { flex: 1 0 100%; display: flex; align-items: center; gap: 8px; margin-top: 4px; padding-top: 14px; border-top: 1px solid var(--line); font-size: .85rem; font-weight: 600; }
.foot .copy .ic { width: 1.1em; height: 1.1em; flex: none; }

@media (max-width: 900px) {
  .hero { grid-template-columns: minmax(0, 1fr); padding-top: 32px; }
  .core { grid-template-columns: minmax(0, 1fr); }
  .cols, .col { display: contents; }
}
@media (max-width: 560px) {
  .brand { display: none; }
  .sec { padding: 18px 14px; }
  .sec-head h3 { font-size: 1.15rem; }
  .rule { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .terms .rule { grid-template-columns: minmax(0, 1fr); }
  .seg button { padding: 5px 12px; min-width: 44px; }
  .seg .lbl { display: none; }
}
/* Animated background: three slow glowing blobs in the blue / red / teal of emergency lights, plus a faint dot grid. Cards turn to frosted glass so it shows through. */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; will-change: transform; animation: drift var(--d) ease-in-out infinite alternate; animation-duration: calc(var(--d) * var(--spd, 1)); }
.bg i:nth-child(1) { --d: 26s; --x: 42vw; --y: 24vh; --s: 1.25; top: -24vmax; left: -16vmax; background: radial-gradient(circle, color-mix(in srgb, var(--blue) 30%, transparent), transparent 62%); }
.bg i:nth-child(2) { --d: 32s; --x: -44vw; --y: 22vh; --s: 1.2; top: -10vmax; right: -24vmax; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 26%, transparent), transparent 62%); }
.bg i:nth-child(3) { --d: 38s; --x: 34vw; --y: -30vh; --s: 1.3; bottom: -30vmax; left: 6vmax; background: radial-gradient(circle, color-mix(in srgb, var(--teal) 26%, transparent), transparent 62%); }
@keyframes drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(var(--x), var(--y), 0) scale(var(--s)); } }
.bg::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(color-mix(in srgb, var(--ink) 16%, transparent) 1px, transparent 1.3px); background-size: 26px 26px; -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000, transparent 75%); mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000, transparent 75%); }
.sec, .core li, .updates, .index, .foot {
  background: color-mix(in srgb, var(--surface) 78%, transparent);
  -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
}
/* Two-column card layout, category switch, fines */
.index { background: color-mix(in srgb, var(--surface) 88%, transparent); }
.empty { order: 99; }

/* Punishment chips by type */
.pun.fine { color: var(--amber); background: color-mix(in srgb, var(--amber) 15%, transparent); }
.pun.ban { color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, transparent); }
.pun.kpz { color: var(--blue); background: color-mix(in srgb, var(--blue) 14%, transparent); }
.pun.warn { color: var(--teal); background: color-mix(in srgb, var(--teal) 15%, transparent); }
.pun.conf, .pun.other { color: var(--slate); background: color-mix(in srgb, var(--slate) 14%, transparent); }
.puns { align-items: center; }
.cn { font-size: .78rem; font-weight: 700; color: var(--muted); }
.rule .n { min-width: 3.1rem; text-align: center; }

/* Map button and dialog */
.map-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: .85rem; transition: background-color .3s ease, transform .25s ease; }
.map-btn:hover { background: var(--surface); }
.map-btn:active { transform: scale(.94); }
.map-btn .ic { color: var(--accent); }
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 58%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  opacity: 0; transition: opacity .3s ease; }
.modal.open { opacity: 1; }
.dialog { width: min(920px, 100%); max-height: 100%; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .55); padding: 20px; transform: translateY(26px) scale(.95); transition: transform .5s cubic-bezier(.34, 1.4, .64, 1); }
.modal.open .dialog { transform: none; }
.dialog-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.dialog-head h2 { font-family: var(--font-display); font-size: 1.25rem; letter-spacing: -.02em; margin: 0; line-height: 1.2; }
.dialog-head small { display: block; color: var(--muted); font-weight: 600; font-size: .85rem; margin-top: 2px; }
.dialog-head .icon-btn { margin-left: auto; flex: none; }
.mapwrap { position: relative; overflow: hidden; }
.mapsvg { display: block; width: 100%; height: auto; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.mapwrap.drag .mapsvg { cursor: grabbing; }
.maptools { position: absolute; top: clamp(10px, 3.2%, 28px); right: clamp(10px, 3.2%, 28px); z-index: 2; display: grid; gap: 8px; }

      if (Date.now() < navLock) return;
      es.forEach(function (e) { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: '-25% 0px -65% 0px' });
    Array.prototype.forEach.call(document.querySelectorAll('main .sec'), function (s) { io.observe(s); });
    setActive(activeId || 'general');
  }
  window.addEventListener('resize', refreshPill);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refreshPill);

  /* Section bar on desktop: arrow buttons, wheel and mouse-drag scrolling, edge fades */
  var navEl = document.getElementById('indexNav');
  var navOl = document.getElementById('nav');
  var prevB = navEl.querySelector('.prev'), nextB = navEl.querySelector('.next');
  function navArrows() {
    if (!prevB) return;
    var max = navOl.scrollWidth - navOl.clientWidth;
    var l = max > 2 && navOl.scrollLeft > 2;
    var r = max > 2 && navOl.scrollLeft < max - 2;
    prevB.hidden = !l;
    nextB.hidden = !r;
    navEl.classList.toggle('fade-l', l);
    navEl.classList.toggle('fade-r', r);
  }
  navOl.addEventListener('scroll', navArrows, { passive: true });
  window.addEventListener('resize', navArrows);
  prevB.addEventListener('click', function () { navOl.scrollBy({ left: -navOl.clientWidth * 0.7, behavior: 'smooth' }); });
  nextB.addEventListener('click', function () { navOl.scrollBy({ left: navOl.clientWidth * 0.7, behavior: 'smooth' }); });
  navOl.addEventListener('wheel', function (e) {
    var max = navOl.scrollWidth - navOl.clientWidth;
    if (max <= 2 || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    if ((e.deltaY > 0 && navOl.scrollLeft >= max - 1) || (e.deltaY < 0 && navOl.scrollLeft <= 0)) return;
    navOl.scrollLeft += e.deltaY;
    e.preventDefault();
  }, { passive: false });
  var drag = null, moved = false;
  navOl.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    drag = { x: e.clientX, left: navOl.scrollLeft };
    moved = false;
  });
  window.addEventListener('mousemove', function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x;
    if (Math.abs(dx) > 5) { moved = true; navEl.classList.add('dragging'); }
    if (moved) navOl.scrollLeft = drag.left - dx;
  });
  window.addEventListener('mouseup', function () { drag = null; navEl.classList.remove('dragging'); });
  navOl.addEventListener('click', function (e) {
    if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; }
  }, true);

  /* Fly to a section instead of jumping: own eased animation, so it also works when the system reduces motion */
  var flight = 0;
  function flyTo(y) {
    var start = window.scrollY, dist = y - start;
    if (Math.abs(dist) < 2) return;
    var dur = Math.min(900, Math.max(450, Math.abs(dist) * 0.45));
    var id = ++flight, t0 = null;
    function step(t) {
      if (id !== flight) return;
      if (t0 === null) t0 = t;
      var p = Math.min(1, (t - t0) / dur);
      var e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      window.scrollTo({ top: start + dist * e, behavior: 'instant' });
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  ['wheel', 'touchstart', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, function () { flight++; }, { passive: true });
  });
  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a) return;
    var el = document.getElementById(a.getAttribute('href').slice(1));
    if (!el) return;
    e.preventDefault();
    var pad = parseFloat(getComputedStyle(root).scrollPaddingTop) || 0;
    flyTo(Math.max(0, el.getBoundingClientRect().top + window.scrollY - pad));
    navLock = Date.now() + 1100;
    if (el.classList.contains('closed')) setOpen(el, true);
    setActive(el.id);
    try { history.replaceState(null, '', '#' + el.id); } catch (err) {}
  });

  /* Map dialog */
  var mapModal = document.getElementById('mapModal'), mapBtn = document.getElementById('mapBtn'), mapClose = document.getElementById('mapClose'), mapHide = 0;
  function openMap() {
    clearTimeout(mapHide);
    mapModal.hidden = false;
    void mapModal.offsetWidth;
    mapModal.classList.add('open');
    mapClose.focus();
  }
  function closeMap() {
    mapModal.classList.remove('open');
    setFull(false);
    mapHide = setTimeout(function () { mapModal.hidden = true; cancelAnimationFrame(mapAnim); view = { x: 0, y: 0, w: BW, h: BH }; applyView(); }, 380);
    mapBtn.focus();
  }
  mapBtn.addEventListener('click', openMap);
  mapClose.addEventListener('click', closeMap);
  mapModal.addEventListener('click', function (e) { if (e.target === mapModal) closeMap(); });

  /* Zoom, pan, reset and full screen for the map */
  var mapSvg = document.getElementById('mapSvg'), mapWrap = document.getElementById('mapWrap'), zoomChip = document.getElementById('zoomChip');
  var fsBtn = document.getElementById('fsBtn');
  var BW = 800, BH = 455.2, MAXZ = 6, view = { x: 0, y: 0, w: BW, h: BH }, mapAnim = 0;
  function clampN(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function clampView(v) {
    v.w = clampN(v.w, BW / MAXZ, BW);
    v.h = v.w * BH / BW;
    v.x = clampN(v.x, 0, BW - v.w);
    v.y = clampN(v.y, 0, BH - v.h);
    return v;
  }
  function applyView() {
    mapSvg.setAttribute('viewBox', view.x.toFixed(2) + ' ' + view.y.toFixed(2) + ' ' + view.w.toFixed(2) + ' ' + view.h.toFixed(2));
    zoomChip.textContent = Math.round(BW / view.w * 100) + '%';
  }
  function toSvg(cx, cy) {
    var m = mapSvg.getScreenCTM();
    if (!m) return { x: view.x + view.w / 2, y: view.y + view.h / 2 };
    var p = new DOMPoint(cx, cy).matrixTransform(m.inverse());
    return { x: p.x, y: p.y };
  }
  function animateView(t, ms) {
    cancelAnimationFrame(mapAnim);
    t = clampView({ x: t.x, y: t.y, w: t.w, h: t.h });
    var f = { x: view.x, y: view.y, w: view.w, h: view.h }, t0 = null, dur = ms || 360;
    function step(ts) {
      if (t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      view = { x: f.x + (t.x - f.x) * e, y: f.y + (t.y - f.y) * e, w: f.w + (t.w - f.w) * e, h: f.h + (t.h - f.h) * e };
      applyView();
      if (p < 1) mapAnim = requestAnimationFrame(step);
    }
    mapAnim = requestAnimationFrame(step);
  }
  /* zoom by factor f keeping svg point p fixed on screen */
  function zoomedAbout(p, f) {
    var nw = clampN(view.w * f, BW / MAXZ, BW), s = nw / view.w;
    return { x: p.x - (p.x - view.x) * s, y: p.y - (p.y - view.y) * s, w: nw, h: nw * BH / BW };
  }
  function zoomStep(f) { animateView(zoomedAbout({ x: view.x + view.w / 2, y: view.y + view.h / 2 }, 1 / f)); }
  function resetView() { animateView({ x: 0, y: 0, w: BW, h: BH }, 420); }

  document.getElementById('zIn').addEventListener('click', function () { zoomStep(1.6); });
  document.getElementById('zOut').addEventListener('click', function () { zoomStep(1 / 1.6); });
  document.getElementById('zReset').addEventListener('click', resetView);

  mapSvg.addEventListener('wheel', function (e) {
    e.preventDefault();
    cancelAnimationFrame(mapAnim);
    var dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    var f = clampN(Math.exp(dy * 0.0018), 0.7, 1.4);
    view = clampView(zoomedAbout(toSvg(e.clientX, e.clientY), f));
    applyView();
  }, { passive: false });
  mapSvg.addEventListener('dblclick', function (e) {
    var p = toSvg(e.clientX, e.clientY);
    if (view.w <= BW / MAXZ + 1) resetView(); else animateView(zoomedAbout(p, 0.5));
  });

  var ptrs = {};
  function ptrList() { return Object.keys(ptrs).map(function (k) { return ptrs[k]; }); }
  mapSvg.addEventListener('pointerdown', function (e) {
    cancelAnimationFrame(mapAnim);
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { mapSvg.setPointerCapture(e.pointerId); } catch (err) {}
    mapWrap.classList.add('drag');
  });
  mapSvg.addEventListener('pointermove', function (e) {
    var prev = ptrs[e.pointerId];
    if (!prev) return;
    var before = ptrList();
    var pd = before.length === 2 ? Math.hypot(before[0].x - before[1].x, before[0].y - before[1].y) : 0;
    var pc = before.length === 2 ? { x: (before[0].x + before[1].x) / 2, y: (before[0].y + before[1].y) / 2 } : null;
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var now = ptrList();
    if (now.length === 1) {
      var m = mapSvg.getScreenCTM();
      if (!m) return;
      view.x -= (e.clientX - prev.x) / m.a;
      view.y -= (e.clientY - prev.y) / m.d;
      view = clampView(view);
      applyView();
    } else if (now.length === 2 && pd > 0) {
      var nd = Math.hypot(now[0].x - now[1].x, now[0].y - now[1].y);
      var nc = { x: (now[0].x + now[1].x) / 2, y: (now[0].y + now[1].y) / 2 };
      var z = zoomedAbout(toSvg(pc.x, pc.y), pd / nd);
      view = clampView(z);
      var m2 = mapSvg.getScreenCTM();
      if (m2) { view.x -= (nc.x - pc.x) / m2.a; view.y -= (nc.y - pc.y) / m2.d; view = clampView(view); }
      applyView();
    }
  });
  function endPtr(e) {
    delete ptrs[e.pointerId];
    if (!ptrList().length) mapWrap.classList.remove('drag');
  }
  mapSvg.addEventListener('pointerup', endPtr);
  mapSvg.addEventListener('pointercancel', endPtr);

  function labelMapTools() {
    var u = T[lang].ui, full = mapModal.classList.contains('full');
    [['zIn', u.zIn], ['zOut', u.zOut], ['zReset', u.zReset]].forEach(function (x) {
      var b = document.getElementById(x[0]);
      b.setAttribute('aria-label', x[1]);
      b.setAttribute('title', x[1]);
    });
    fsBtn.setAttribute('aria-label', full ? u.fsOff : u.fsOn);
    fsBtn.setAttribute('title', full ? u.fsOff : u.fsOn);
  }
  function setFull(on, skipNative) {
    if (mapModal.classList.contains('full') === on) return;
    mapModal.classList.toggle('full', on);
    labelMapTools();
    if (skipNative) return;
    try {
      if (on && mapModal.requestFullscreen) { var a = mapModal.requestFullscreen(); if (a && a.catch) a.catch(function () {}); }
      else if (!on && document.fullscreenElement && document.exitFullscreen) { var b = document.exitFullscreen(); if (b && b.catch) b.catch(function () {}); }
    } catch (err) {}
  }
  fsBtn.addEventListener('click', function () { setFull(!mapModal.classList.contains('full')); });
  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement && mapModal.classList.contains('full')) setFull(false, true);
  });

  document.addEventListener('keydown', function (e) {
    if (mapModal.hidden) return;
    if (e.key === 'Escape') { if (mapModal.classList.contains('full')) setFull(false); else closeMap(); }
    else if (e.key === 'Tab') { e.preventDefault(); mapClose.focus(); }
    else if (e.key === '+' || e.key === '=') zoomStep(1.6);
    else if (e.key === '-' || e.key === '_') zoomStep(1 / 1.6);
    else if (e.key === '0') resetView();
  });

  /* Back to top */
  var topBtn = document.getElementById('toTop'), topBar = document.getElementById('topBar'), ticking = false;
  function onScroll() {
    ticking = false;
    var y = window.scrollY, max = document.documentElement.scrollHeight - window.innerHeight;
    topBtn.classList.toggle('show', y > 500);
    topBar.style.strokeDashoffset = String(157.08 * (1 - (max > 0 ? Math.min(1, y / max) : 0)));
  }
  window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
  window.addEventListener('resize', onScroll);
  topBtn.addEventListener('click', function () {
    navLock = Date.now() + 1100;
    flyTo(0);
    setActive('general');
  });

  render();
  onScroll();
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { ['langSeg', 'catSeg'].forEach(function (id) { document.getElementById(id).classList.add('ready'); }); });
  });
})();
</script>
